<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B8BFF"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEF0FF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1E1B6B" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- stacked cards = piles of photos -->
  <rect x="262" y="262" width="500" height="500" rx="96" fill="#FFFFFF" opacity="0.30" transform="rotate(-14 512 512)"/>
  <rect x="262" y="262" width="500" height="500" rx="96" fill="#FFFFFF" opacity="0.55" transform="rotate(-6 512 512)"/>
  <g transform="rotate(4 512 512)" filter="url(#sh)">
    <rect x="262" y="262" width="500" height="500" rx="96" fill="url(#sky)"/>
    <circle cx="612" cy="396" r="52" fill="#FBBF24"/>
    <path d="M316 668 L468 468 L572 598 L636 524 L720 668 Z" fill="#5B5BF0"/>
    <path d="M468 468 L520 536 L488 548 L468 522 L440 540 Z" fill="#FFFFFF" opacity="0.9"/>
  </g>
